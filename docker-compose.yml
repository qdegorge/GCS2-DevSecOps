version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: secops_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: intranet_db
      MYSQL_USER: secops_user
      MYSQL_PASSWORD: secopspassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: secops_flask
    restart: always
    ports:
      - "5050:5050"
    environment:
      DB_HOST: db
      DB_USER: secops_user
      DB_PASSWORD: secopspassword
      DB_NAME: intranet_db
    depends_on:
      - db

volumes:
  db_data: